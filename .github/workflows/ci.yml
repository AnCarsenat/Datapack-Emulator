name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # the emulator core is standard library only; the suite needs pytest
      - run: pip install -e . "pytest>=8"
      - run: python -m pytest

  gui:
    name: Window tests (offscreen Qt)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # shared libraries PySide6 and QtWebEngine load even without a display
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libnss3
          libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_window.py

  smoke:
    name: CLI smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: datapack-emulator-cli --quiet run samples/hat --ticks 5
      - run: datapack-emulator-cli --quiet matrix samples/hat_v2 --declared --boundaries --ticks 3
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: generated/*.html
