[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datapack-emulator"
version = "0.1.0"
description = "Run, profile and version-test Minecraft datapacks outside the game."
readme = "readme.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ancar" }]
keywords = ["minecraft", "datapack", "mcfunction", "emulator", "profiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Testing",
]
# The emulator core (datapack_emulator.emulator) is pure standard library.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.12", "coverage[toml]>=7"]

[project.scripts]
datapack-emulator = "datapack_emulator.app:main"
datapack-emulator-cli = "datapack_emulator.cli:main"

[project.urls]
Repository = "https://github.com/AnCarsenat/Datapack-Emulator"
Issues = "https://github.com/AnCarsenat/Datapack-Emulator/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["datapack_emulator*"]

[tool.setuptools.package-data]
"datapack_emulator.window" = ["*.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
# the Qt-free code; the window needs PySide6's stubs and is not checked yet
files = [
    "src/datapack_emulator/emulator",
    "src/datapack_emulator/cli",
    "src/datapack_emulator/project.py",
    "src/datapack_emulator/settings",
]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["datapack_emulator"]
branch = true
# the CI test job runs without Qt; the window has its own job
omit = ["*/datapack_emulator/window/*", "*/datapack_emulator/app.py"]

[tool.coverage.report]
skip_empty = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "src/.venv", "src/datapack_emulator/emulator/version_data.py"]

[tool.ruff.format]
# keep hand-aligned examples in the docs as written
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # QModelIndex() default arguments are the Qt model idiom
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["datapack_emulator"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# vanilla strings are kept on one line, as in en_us.json
"src/datapack_emulator/emulator/runtime/messages.py" = ["E501"]
